services:
  gamearr:
    image: gamearr:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamearr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - /path/to/games:/games
      - /path/to/downloads:/downloads
    ports:
      - "8484:8484"
    restart: unless-stopped
